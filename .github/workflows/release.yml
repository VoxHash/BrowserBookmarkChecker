name: Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]

    steps:
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller build wheel

      - name: Build Python distribution
        run: |
          python -m build

      - name: Build executable (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          pyinstaller --onefile --windowed --name=BrowserBookmarkChecker --add-data "assets:assets" --add-data "bookmark_checker/i18n:bookmark_checker/i18n" --hidden-import=PyQt6 --hidden-import=rapidfuzz --hidden-import=bs4 bookmark_checker/__main__.py
          chmod +x dist/BrowserBookmarkChecker

      - name: Build executable (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          pyinstaller --onefile --windowed --name=BrowserBookmarkChecker --add-data "assets;assets" --add-data "bookmark_checker/i18n;bookmark_checker/i18n" --hidden-import=PyQt6 --hidden-import=rapidfuzz --hidden-import=bs4 bookmark_checker/__main__.py

      - name: Build executable (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          pyinstaller --onefile --windowed --name=BrowserBookmarkChecker --add-data "assets:assets" --add-data "bookmark_checker/i18n:bookmark_checker/i18n" --hidden-import=PyQt6 --hidden-import=rapidfuzz --hidden-import=bs4 bookmark_checker/__main__.py
          chmod +x dist/BrowserBookmarkChecker

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          if [ -f dist/dist-ubuntu-latest/BrowserBookmarkChecker ]; then
            cp dist/dist-ubuntu-latest/BrowserBookmarkChecker release-assets/BrowserBookmarkChecker-linux-x64
          fi
          if [ -f dist/dist-windows-latest/BrowserBookmarkChecker.exe ]; then
            cp dist/dist-windows-latest/BrowserBookmarkChecker.exe release-assets/BrowserBookmarkChecker-windows-x64.exe
          fi
          if [ -f dist/dist-macos-latest/BrowserBookmarkChecker ]; then
            cp dist/dist-macos-latest/BrowserBookmarkChecker release-assets/BrowserBookmarkChecker-macos-x64
          fi
          cp dist/dist-ubuntu-latest/browser_bookmark_checker-*.whl release-assets/ 2>/dev/null || true
          cp dist/dist-ubuntu-latest/browser_bookmark_checker-*.tar.gz release-assets/ 2>/dev/null || true
          ls -la release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
